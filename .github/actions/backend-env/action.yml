name: Backend environment
description: >
  The full backend environment (every extra plus the dev tools), installed
  from uv.lock with every package's hash checked, as `uv sync --frozen` does.
  Used by the backend jobs in pr.yml instead of `uv sync`.

# Why not `uv sync`: in this repository's CI, `uv sync` took 60 to 90 seconds
# per job, while installing the same locked packages with `uv pip install`
# took about 6 (PR #27). After this step `uv run ...` uses the environment
# as it is (UV_NO_SYNC=1), so existing commands keep working unchanged.

runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        version: "0.11.7"
        enable-cache: true
        cache-dependency-glob: backend/uv.lock

    - name: Install the locked backend environment
      shell: bash
      working-directory: backend
      run: |
        uv export --frozen --all-extras --format requirements-txt --no-emit-project \
          -o "$RUNNER_TEMP/backend-requirements.txt"
        uv venv .venv --python 3.12
        uv pip install --python .venv/bin/python --require-hashes \
          -r "$RUNNER_TEMP/backend-requirements.txt"
        uv pip install --python .venv/bin/python --no-deps -e .
        echo "UV_NO_SYNC=1" >> "$GITHUB_ENV"
        echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
        echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
