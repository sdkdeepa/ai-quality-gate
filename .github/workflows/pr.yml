name: PR Checks

# Deterministic CI (Sprint 11 requirement): every job here uses only the
# DeterministicProvider (fixture-replay) or pure static analysis - nothing
# in this file ever calls a real OpenAI/Gemini/RAGAS-judge/DeepEval-judge/
# OpenAI-Evals-judge API, so no repository secret is required for this
# workflow to run, and it never incurs cost. The manual, secrets-gated
# live-provider workflow is a separate file - see .github/workflows/live-eval.yml
# and docs/ci-cd.md.
# Runs once per change, on the pull request. There is no second run on push
# to main: "Require branches to be up to date before merging" (main's branch
# protection) makes the PR run test exactly what lands. Run it by hand from
# the Actions tab when needed (workflow_dispatch).
on:
  pull_request:
  workflow_dispatch: {}

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  # --- 1. lint / formatting ---
  lint:
    name: Lint & formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.11.7"

      # ruff alone, at the version pinned in uv.lock, without installing the
      # whole backend environment just to lint it.
      - name: Backend - ruff check and format --check
        working-directory: backend
        run: |
          RUFF_VERSION="$(python3 -c 'import tomllib; print(next(p["version"] for p in tomllib.load(open("uv.lock", "rb"))["package"] if p["name"] == "ruff"))')"
          uvx "ruff@${RUFF_VERSION}" check .
          uvx "ruff@${RUFF_VERSION}" format --check .

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend - install
        working-directory: frontend
        run: npm ci

      - name: Frontend - lint (oxlint)
        working-directory: frontend
        run: npm run lint

      - name: Frontend - type-check
        working-directory: frontend
        run: npx tsc -b

  # --- dependency/security scanning (Sprint 12) ---
  # Neither tool needs a real provider API key or any repository secret -
  # both scan already-resolved dependency manifests (uv.lock,
  # package-lock.json) against public vulnerability databases. Blocking
  # (not informational): both currently pass clean, so a newly-introduced
  # vulnerable dependency should fail the PR, not just get logged.
  security-scan:
    name: Dependency security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.11.7"

      - name: Backend - pip-audit
        working-directory: backend
        run: uv tool run pip-audit --strict

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend - npm audit
        working-directory: frontend
        run: |
          npm ci
          npm audit --audit-level=high

  # --- 2. backend unit tests ---
  backend-unit-tests:
    name: Backend unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up the backend environment
        uses: ./.github/actions/backend-env

      # Everything except tests/api/ - domain models, the evaluator
      # frameworks (deterministic/RAGAS/DeepEval/OpenAI-Evals, all mocked -
      # see each framework's own test suite for why no network call ever
      # happens here), the Policy Engine, repositories, RAG pipeline,
      # observability. tests/api/ (real HTTP request/response through
      # TestClient) is its own job below, matching Sprint 11's explicit
      # "backend unit tests" + "API/integration tests" split.
      - name: Run unit tests with coverage
        working-directory: backend
        run: |
          uv run pytest -q -m "not smoke" tests --ignore=tests/api --ignore=tests/compat \
            --cov=app --cov-report=term-missing --cov-report=xml:coverage-unit.xml \
            --junitxml=test-results/unit.xml

      - name: Upload JUnit results for the quality gate
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: junit-unit
          path: backend/test-results/unit.xml
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-backend-unit
          path: backend/coverage-unit.xml
          retention-days: 14

  # --- 2b. backward-compatibility tests (M0) ---
  # Locks in today's behavior before the framework work starts: gate
  # decisions and evaluator results on the bundled datasets, the HTTP API
  # contract (every route, status codes and response shapes), write-access
  # rules, and SQLite persistence across a restart. Snapshots live in
  # backend/tests/compat/snapshots/; a PR that changes one must say why.
  compatibility:
    name: Backward compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up the backend environment
        uses: ./.github/actions/backend-env

      - name: Run compatibility tests
        working-directory: backend
        run: uv run pytest -q tests/compat --junitxml=test-results/compat.xml

      - name: Upload JUnit results for the quality gate
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: junit-compat
          path: backend/test-results/compat.xml
          retention-days: 14

  # --- 2c. packaging (M7) ---
  # Since M7 the package installs in two ways: the core only (the aqg CLI:
  # pydantic, jsonschema, pyyaml) and with extras (the server). These jobs
  # install it fresh each way, outside uv sync and the lock-file environment
  # the jobs above use, the way a user would.
  core-install:
    name: Core-only install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.11.7"

      - name: Install the package with no extras
        run: |
          uv venv /tmp/aqg-core --python ${{ env.PYTHON_VERSION }}
          uv pip install --python /tmp/aqg-core/bin/python ./backend
          uv pip list --python /tmp/aqg-core/bin/python

      - name: No server, RAG, judge, tracing or AI SDK packages are installed
        run: |
          /tmp/aqg-core/bin/python - <<'PY'
          from importlib.util import find_spec
          heavy = ["fastapi", "starlette", "uvicorn", "langchain_core", "langchain_community",
                   "chromadb", "ragas", "deepeval", "opentelemetry", "phoenix", "openinference",
                   "openai", "google.genai"]
          present = []
          for name in heavy:
              try:
                  if find_spec(name) is not None:
                      present.append(name)
              except ModuleNotFoundError:
                  pass
          assert not present, f"core-only install contains server packages: {present}"
          print("no server, RAG, judge, tracing or AI SDK packages installed")
          PY

      # --confcutdir keeps pytest from loading tests/conftest.py, which
      # imports the server; tests/aqg/conftest.py leaves out the two test
      # modules that compare aqg with the server.
      - name: Run the aqg tests
        working-directory: backend
        run: |
          uv pip install --python /tmp/aqg-core/bin/python "pytest>=8.3.0"
          /tmp/aqg-core/bin/python -m pytest -q tests/aqg --confcutdir=tests/aqg -p no:cacheprovider

      - name: aqg check on the fixtures gives BLOCK (exit 1)
        run: |
          mkdir -p /tmp/aqg-check/reports
          cp backend/tests/aqg/fixtures/junit/{pytest,vitest,playwright}.xml /tmp/aqg-check/reports/
          printf '%s\n' \
            'version: 1' \
            'project: fixtures' \
            'inputs:' \
            '  - {type: junit, path: reports/pytest.xml, suite: backend}' \
            '  - {type: junit, path: reports/vitest.xml, suite: unit}' \
            '  - {type: junit, path: reports/playwright.xml, suite: e2e}' \
            > /tmp/aqg-check/quality-gate.yml
          set +e
          /tmp/aqg-core/bin/aqg check --config /tmp/aqg-check/quality-gate.yml
          code=$?
          set -e
          test "$code" = 1 || { echo "expected BLOCK (exit 1), got $code" >&2; exit 1; }

      - name: Importing the server says which extra to install
        run: |
          if (cd /tmp && /tmp/aqg-core/bin/python -c "import app" 2>/tmp/app-import.err); then
            echo "importing the server should fail in a core-only install" >&2
            exit 1
          fi
          cat /tmp/app-import.err
          grep -q "pip install 'ai-quality-gate\[server\]'" /tmp/app-import.err

  full-install:
    name: Full install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.11.7"

      # A fresh environment with every extra, installed the way pip would,
      # held to the versions in uv.lock so this job tests packaging rather
      # than whatever was released upstream today.
      - name: Install the package with all extras
        run: |
          (cd backend && uv export --frozen --all-extras --no-dev --no-emit-project --no-hashes \
            --format requirements-txt -o /tmp/aqg-constraints.txt)
          uv venv /tmp/aqg-full --python ${{ env.PYTHON_VERSION }}
          uv pip install --python /tmp/aqg-full/bin/python "./backend[all]" -c /tmp/aqg-constraints.txt
          uv pip install --python /tmp/aqg-full/bin/python "pytest>=8.3.0" "pytest-cov>=6.0.0" "httpx>=0.27.0"

      - name: Full test suite
        working-directory: backend
        run: /tmp/aqg-full/bin/python -m pytest -q -p no:cacheprovider

      - name: M0 compatibility tests (gate snapshots, API contract, database workflows)
        working-directory: backend
        run: /tmp/aqg-full/bin/python -m pytest -q -p no:cacheprovider tests/compat

  install-from-github:
    name: Install from GitHub
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.11.7"

      # The commit under test, from the repository it lives in (a fork's,
      # for a fork PR). The package is in backend/, hence #subdirectory.
      - name: pip install from git+https at this commit
        env:
          SOURCE_REPO: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          uv venv /tmp/aqg-git --python ${{ env.PYTHON_VERSION }}
          uv pip install --python /tmp/aqg-git/bin/python \
            "ai-quality-gate @ git+https://github.com/${SOURCE_REPO}@${SOURCE_SHA}#subdirectory=backend"
          /tmp/aqg-git/bin/aqg --version

      - name: The installed aqg validates and checks a project
        run: |
          mkdir -p /tmp/aqg-git-check/reports
          cp backend/tests/aqg/fixtures/junit/vitest.xml /tmp/aqg-git-check/reports/
          printf '%s\n' \
            'version: 1' \
            'project: fixtures' \
            'inputs:' \
            '  - {type: junit, path: reports/vitest.xml, suite: unit}' \
            'policy: {on_optional_failed: ignore, on_optional_skipped: ignore}' \
            > /tmp/aqg-git-check/quality-gate.yml
          /tmp/aqg-git/bin/aqg validate --config /tmp/aqg-git-check/quality-gate.yml
          /tmp/aqg-git/bin/aqg check --config /tmp/aqg-git-check/quality-gate.yml

  # --- 3. API / integration tests ---
  backend-api-tests:
    name: Backend API/integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up the backend environment
        uses: ./.github/actions/backend-env

      # tests/api/ drives the app exclusively through FastAPI's TestClient
      # (a real ASGI request/response cycle, all routers/middleware/
      # dependency-injection included) - distinct coverage from the unit
      # tests above, which import app internals directly.
      - name: Run API tests with coverage
        working-directory: backend
        run: |
          uv run pytest -q tests/api \
            --cov=app --cov-report=term-missing --cov-report=xml:coverage-api.xml \
            --junitxml=test-results/api.xml

      - name: Upload JUnit results for the quality gate
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: junit-api
          path: backend/test-results/api.xml
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-backend-api
          path: backend/coverage-api.xml
          retention-days: 14

  # --- 4. frontend tests ---
  frontend-tests:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Run tests with coverage
        working-directory: frontend
        run: npm run test:coverage

      - name: Build (type-check + production bundle)
        working-directory: frontend
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-frontend
          path: frontend/coverage/lcov.info
          retention-days: 14

  # --- 5. deterministic Quality Gate smoke suite ---
  smoke-suite:
    name: Deterministic smoke suite
    runs-on: ubuntu-latest
    needs: [backend-unit-tests, backend-api-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Set up the backend environment
        uses: ./.github/actions/backend-env

      # Deterministic provider only - no AQG_OPENAI_API_KEY/AQG_GEMINI_API_KEY
      # anywhere in this job, so it needs no repository secret and costs
      # nothing to run on every PR (Sprint 11 requirement: "Do NOT require
      # paid model APIs for every PR" / "Use DeterministicProvider in
      # standard CI").
      - name: Start the API
        working-directory: backend
        run: |
          uv run uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          echo $! > /tmp/uvicorn.pid
          for i in $(seq 1 30); do
            curl -s -o /dev/null http://127.0.0.1:8000/health && exit 0
            sleep 1
          done
          echo "server did not become healthy in time" >&2
          exit 1

      - name: Run smoke suite against the real running API
        run: bash scripts/smoke_test.sh http://127.0.0.1:8000

      - name: Stop the API
        if: always()
        run: kill "$(cat /tmp/uvicorn.pid)" 2>/dev/null || true

  # --- 6. Docker build validation ---
  # Starts at once (it used to wait for lint). Plain `docker build`: a
  # GitHub Actions layer cache was tried in PR #28 and made the backend build
  # slower (1m48s against 52s), because saving the cache costs more than it
  # saves for this image.
  docker-build:
    name: Docker build validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t ai-quality-gate-backend:ci ./backend

      - name: Build frontend image
        run: docker build -t ai-quality-gate-frontend:ci ./frontend

      # Beyond "does it build": start the actual backend image and run
      # the same deterministic smoke suite against it, so this job also
      # catches problems that only show up in the built image (missing
      # files from a bad COPY, wrong CMD/ENTRYPOINT, permission issues
      # under the non-root user, etc.) rather than only in `uv run`.
      - name: Start backend container
        run: |
          docker run -d --name backend-ci -p 8000:8000 -v aqg-ci-data:/app/data ai-quality-gate-backend:ci
          for i in $(seq 1 30); do
            curl -s -o /dev/null http://127.0.0.1:8000/health && exit 0
            sleep 1
          done
          echo "container did not become healthy in time" >&2
          docker logs backend-ci
          exit 1

      - name: Readiness responds
        run: curl --fail --silent --show-error http://127.0.0.1:8000/ready

      # M0 compatibility against the real image: the same API contract
      # snapshot as the in-process test, then data persistence when the
      # container is replaced (same named volume, new container).
      - name: Set up the backend environment
        uses: ./.github/actions/backend-env

      - name: API contract against the backend container
        working-directory: backend
        env:
          AQG_COMPAT_BASE_URL: http://127.0.0.1:8000
        run: uv run pytest -q tests/compat/test_api_contract.py

      - name: Data survives replacing the container
        run: |
          bash scripts/compat_restart_check.sh http://127.0.0.1:8000 \
            "docker rm -f backend-ci && docker run -d --name backend-ci -p 8000:8000 -v aqg-ci-data:/app/data ai-quality-gate-backend:ci"

      - name: Run smoke suite against the backend container
        run: bash scripts/smoke_test.sh http://127.0.0.1:8000

      - name: Confirm the frontend container serves its static assets
        run: |
          docker run -d --name frontend-ci -p 5173:8080 \
            -e API_BASE_URL=http://127.0.0.1:8000/api/v1 \
            ai-quality-gate-frontend:ci
          for i in $(seq 1 20); do
            curl -s -o /dev/null http://127.0.0.1:5173/ && exit 0
            sleep 1
          done
          echo "frontend container did not become healthy in time" >&2
          docker logs frontend-ci
          exit 1

      - name: Confirm env-config.js reflects the injected API_BASE_URL
        run: |
          curl -s http://127.0.0.1:5173/env-config.js | grep -q "127.0.0.1:8000" \
            || (echo "env-config.js did not contain the injected API_BASE_URL" >&2; exit 1)

      - name: Tear down containers
        if: always()
        run: |
          docker rm -f backend-ci frontend-ci 2>/dev/null || true
          docker volume rm aqg-ci-data 2>/dev/null || true

  # --- 6b. the gate checks itself (M8) ---
  # The backend test jobs write JUnit XML; this job runs this repository's
  # own action on it with quality-gate.yml. It also runs when a test job
  # failed, so the summary shows what the gate decided and why.
  quality-gate:
    name: Quality gate (self-check)
    runs-on: ubuntu-latest
    needs: [backend-unit-tests, backend-api-tests, compatibility]
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: junit-*
          path: backend/test-results
          merge-multiple: true

      - name: Quality gate
        uses: ./
        with:
          config: quality-gate.yml
          artifact-name: quality-gate-self-check

  # --- 6c. the action itself (M8) ---
  # Runs the action on the M2 fixtures: the real reports (with failures)
  # must BLOCK and fail the step; a lenient policy must PASS.
  action-test:
    name: GitHub Action test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Action on reports with failures
        id: block
        continue-on-error: true
        uses: ./
        with:
          config: backend/tests/aqg/fixtures/action/blocking.yml
          artifact-name: action-test-blocking

      - name: Action with a lenient policy
        id: pass
        uses: ./
        with:
          config: backend/tests/aqg/fixtures/action/passing.yml
          output: ${{ runner.temp }}/passing-report
          artifact-name: action-test-passing
          version: v0.0.0-test

      - name: Check the action's results
        env:
          BLOCK_OUTCOME: ${{ steps.block.outcome }}
          BLOCK_DECISION: ${{ steps.block.outputs.decision }}
          BLOCK_CODE: ${{ steps.block.outputs.exit-code }}
          PASS_DECISION: ${{ steps.pass.outputs.decision }}
          PASS_CODE: ${{ steps.pass.outputs.exit-code }}
          PASS_DIR: ${{ steps.pass.outputs.report-dir }}
        run: |
          test "$BLOCK_OUTCOME" = failure
          test "$BLOCK_DECISION" = block
          test "$BLOCK_CODE" = 1
          test "$PASS_DECISION" = pass
          test "$PASS_CODE" = 0
          python3 -c 'import json, sys; r = json.load(open(sys.argv[1])); assert r["run"]["version"] == "v0.0.0-test", r["run"]["version"]' "$PASS_DIR/report.json"
          echo "action BLOCKs on failures and PASSes under a lenient policy"

  # --- 7. coverage ---
  coverage:
    name: Coverage summary
    runs-on: ubuntu-latest
    needs: [backend-unit-tests, backend-api-tests, frontend-tests]
    if: always()
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: coverage-artifacts
          merge-multiple: false

      - name: Summarize coverage
        run: |
          echo "## Coverage" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Raw reports uploaded as workflow artifacts (kept 14 days):" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          find coverage-artifacts -type f | while read -r f; do
            echo "- \`$f\`" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Backend coverage was ~98% and frontend ~90% at the time this workflow was authored (Sprint 11) - no hard threshold is enforced yet; see PROJECT_STATE.md's Sprint 11 section for why." >> "$GITHUB_STEP_SUMMARY"