server {
    # 8080, not 80: the runtime image (nginxinc/nginx-unprivileged) runs as
    # a non-root user, which can't bind ports below 1024.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # env-config.js is rewritten by docker-entrypoint.sh at container
    # startup — never cache it, or a redeployed/reconfigured container
    # could serve a stale API_BASE_URL to a client with a warm cache.
    location = /env-config.js {
        add_header Cache-Control "no-store";
    }

    # HashRouter (frontend/src/App.tsx) means every real route already
    # lives after a "#" the server never sees — this try_files fallback is
    # just standard SPA-safety in case that ever changes, not load-bearing
    # for routing today.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
