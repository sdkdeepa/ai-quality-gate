[project]
name = "ai-quality-gate"
version = "0.1.0"
description = "AI Quality Gate - evaluates LLM/RAG applications before release and returns PASS/WARN/BLOCK decisions."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "jsonschema>=4.26.0",
    "openai>=1.54.0",
    "google-genai>=1.0.0",
    "langchain-core>=0.3.0,<1.0.0",
    "langchain-text-splitters>=0.3.0",
    "langchain-community>=0.3.31,<0.4.0",
    "langchain-chroma>=0.2.0",
    "chromadb>=0.5.0",
    # Sprint 5 (RAGAS integration). Pinned below the 0.4.x line: ragas 0.4.3
    # imports `langchain_community.chat_models.vertexai`, which moved to the
    # `langchain_classic` package in langchain-community>=0.4.0 — that combo
    # fails at import time. langchain-openai is pinned to match the same
    # langchain-core generation. See DECISIONS.md #21.
    "ragas>=0.4.3,<0.5.0",
    "langchain-openai>=0.3.0,<0.4.0",
    # Sprint 6 (DeepEval integration). Resolved cleanly against the Sprint 5
    # pins above with no further constraints needed — verified via `uv add`
    # + full test suite. See DECISIONS.md #23.
    "deepeval>=4.2.0,<5.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["smoke: hits a real provider API; requires an API key env var and may incur cost"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
